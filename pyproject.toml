[project]
name = "pockmark-groundwater-model"
version = "0.1.0"
description = "2D MODFLOW-6 transient flow model and parameter sweep for sustained mud-only pockmark formation at the New England Mud Patch."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Callum Hood-Cree" },
]
maintainers = [
    { name = "Callum Hood-Cree" },
]
dependencies = [
    "flopy>=3.10.0",
    "h5py>=3.16.0",
    "ipywidgets>=8.1.8",
    "joblib>=1.5.3",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=2.3.3",
    "scipy>=1.17.1",
]
